name: Install Meta Pixel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-pixel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Meta Pixel and Lead event
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          pixel_id = "1433494675310796"
          marker = "ECAM_META_PIXEL_1433494675310796"

          if marker not in html:
              pixel = f'''<!-- {marker} -->\n<script>\n!function(f,b,e,v,n,t,s){{if(f.fbq)return;n=f.fbq=function(){{n.callMethod?\n n.callMethod.apply(n,arguments):n.queue.push(arguments)}};if(!f._fbq)f._fbq=n;\n n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;\n t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}}(window, document,'script',\n'https://connect.facebook.net/en_US/fbevents.js');\nfbq('init', '{pixel_id}');\nfbq('track', 'PageView');\n</script>\n<noscript><img height=\"1\" width=\"1\" style=\"display:none\"\nsrc=\"https://www.facebook.com/tr?id={pixel_id}&ev=PageView&noscript=1\" /></noscript>\n<!-- /{marker} -->'''
              html = html.replace("</head>", pixel + "\n</head>", 1)

          lead_marker = "ECAM_META_PIXEL_LEAD_EVENT"
          if lead_marker not in html:
              target = 'status.textContent="Thank you. Your educational request has been received.";'
              replacement = target + f'\n    /* {lead_marker} */\n    if(typeof window.fbq === "function"){{fbq("track","Lead");}}'
              if target not in html:
                  raise SystemExit("Lead success handler target not found; refusing to modify index.html")
              html = html.replace(target, replacement, 1)

          path.write_text(html, encoding="utf-8")

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "Meta Pixel already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Install Meta Pixel and Lead event"
          git push
