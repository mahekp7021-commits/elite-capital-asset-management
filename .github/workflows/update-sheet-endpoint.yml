name: Update Sheet Endpoint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update endpoint and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://script.google.com/macros/s/AKfycbykKzqN32OLf6V9Pts4EQ4JlV-b7ti-h--7i-4d8GEcargeCG_rzfW4wwLVgjRAre3Z/exec'
          new = 'https://script.google.com/macros/s/AKfycbxzKHfgux0gBrBI77VAEPMHmascSqgMXfZkpmhj38TNgEfcvxM0eX0c0lOETy0aS2wg/exec'
          if old not in s:
              raise SystemExit('Old endpoint not found; stopping to avoid unintended changes.')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/update-sheet-endpoint.yml

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-sheet-endpoint.yml
          git commit -m 'Update lead form sheet endpoint'
          git push
