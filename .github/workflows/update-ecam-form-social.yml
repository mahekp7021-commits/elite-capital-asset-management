name: Update ECAM lead form

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redesign only the lead form
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'ECAM_FORM_SOCIAL_V2'
          if marker in text:
              print('Form already updated; nothing to do.')
              raise SystemExit(0)

          css_anchor = '.privacy-note a{color:#0969df;text-decoration:underline}'
          css_add = '''\n/* ECAM_FORM_SOCIAL_V2 */\n.lead-card{width:440px;padding:25px 27px;border-radius:16px}.lead-brand{display:flex;justify-content:center;margin-bottom:10px}.lead-brand img{width:150px;height:auto;display:block}.lead-card h2{text-align:center;font-size:29px;margin:5px 0 7px}.lead-card>p{text-align:center;font-size:13px;margin:0 0 14px}.lead-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 9px}.lead-fields .full{grid-column:1/-1}.lead-fields .field{margin-bottom:9px}.lead-card .field input,.lead-card .field select{height:42px;border-radius:7px;font-size:13px}.form-submit{height:43px;border-radius:7px;margin-top:2px}.direct-connect{margin-top:14px;padding-top:12px;border-top:1px solid #dfe7ef}.direct-connect-title{text-align:center;font-size:10px;font-weight:800;color:#61758c;letter-spacing:.08em;margin-bottom:9px}.direct-connect-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.direct-connect a{height:42px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:7px;color:#fff;font-size:12px;font-weight:800}.wa-connect{background:#16a34a}.tg-connect{background:#159bd7}.direct-connect svg{width:19px;height:19px;fill:currentColor;flex:none}.privacy-note{margin-top:10px}\n@media(max-width:560px){.lead-card{width:100%;padding:22px 18px}.lead-fields{grid-template-columns:1fr}.lead-fields .full{grid-column:auto}.lead-brand img{width:135px}.lead-card h2{font-size:25px}.direct-connect-row{grid-template-columns:1fr 1fr}.direct-connect a{font-size:11px}}\n'''
          if css_anchor not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(css_anchor, css_anchor + css_add, 1)

          start = text.index('<form class="lead-card" id="leadForm"')
          end = text.index('</form>', start) + len('</form>')
          action_start = text.index(' action="', start)
          action_end = text.index('"', action_start + 8) + 1
          action = text[action_start:action_end]

          form = f'''<form class="lead-card" id="leadForm"{action} method="POST" target="leadSubmitFrame">\n<div class="lead-brand"><img src="assets/logo/ecam-logo.png" alt="Elite Capital Asset Management"></div>\n<h2>Get Educational <span>Information</span></h2>\n<p>Fill in your details and let us know what you'd like to learn. Our team can share relevant educational resources with you.</p>\n<div class="lead-fields">\n<div class="field full"><input name="name" placeholder="Full Name" autocomplete="name" required></div>\n<div class="field"><input name="email" type="email" placeholder="Email Address" autocomplete="email" required></div>\n<div class="field"><input name="mobile" placeholder="Mobile Number" autocomplete="tel" inputmode="tel" required></div>\n<div class="field full"><input name="city" placeholder="Your City" autocomplete="address-level2" required></div>\n<div class="field full"><select name="topic" required><option value="">What would you like to learn?</option><option>Stock Market Basics</option><option>Options Basics</option><option>Calls &amp; Puts</option><option>Premium &amp; Expiry</option><option>Risk &amp; Reward</option></select></div>\n</div>\n<button class="btn btn-main form-submit" type="submit">Submit Interest <span>→</span></button>\n<div class="direct-connect"><div class="direct-connect-title">OR CONNECT DIRECTLY</div><div class="direct-connect-row"><a class="wa-connect" href="https://wa.me/919769190408" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11.7 11.7 0 0 0 12.1 0C5.7 0 .5 5.2.5 11.6c0 2 .5 4 1.5 5.7L.4 23.9l6.8-1.8a11.6 11.6 0 0 0 5 1.1h.1c6.4 0 11.6-5.2 11.6-11.6 0-3.1-1.2-6-3.5-8.1ZM12.3 21.2c-1.6 0-3.2-.4-4.6-1.2l-.3-.2-4 1 1.1-3.9-.2-.3a9.6 9.6 0 0 1-1.5-5.1c0-5.3 4.3-9.6 9.6-9.6 2.6 0 5 1 6.8 2.8a9.5 9.5 0 0 1 2.8 6.8c0 5.3-4.3 9.6-9.6 9.6Zm5.3-7.2c-.3-.2-1.7-.8-2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-1.6-.8-2.6-1.4-3.7-3.2-.3-.5.3-.5.8-1.6.1-.2.1-.4 0-.6-.1-.2-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.6s1.2 3 1.4 3.2c.2.2 2.3 3.5 5.6 4.9.8.4 1.5.6 2 .8.8.2 1.6.2 2.2.1.7-.1 2.1-.9 2.4-1.8.3-.9.3-1.7.2-1.8-.1-.2-.3-.3-.6-.5Z"/></svg>WhatsApp</a><a class="tg-connect" href="https://t.me/+919769190408" target="_blank" rel="noopener" aria-label="Contact on Telegram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.8 3.3 18.5 20c-.3 1.2-1 1.5-2 .9l-5.5-4.1-2.7 2.6c-.3.3-.5.5-1 .5l.4-5.6 10.2-9.2c.4-.4-.1-.6-.6-.2L4.7 12.7l-5.4-1.7c-1.2-.4-1.2-1.2.3-1.8L20.7 1.4c1-.4 1.8.2 1.1 1.9Z"/></svg>Telegram</a></div></div>\n<div class="privacy-note"><span>▣</span><span>Your information is used to respond to your enquiry. Please review our <a href="privacy.html">Privacy Policy</a>.</span></div><input type="hidden" name="_subject" value="New ECAM Educational Lead"><div class="form-status" id="formStatus" aria-live="polite"></div></form>'''

          text = text[:start] + form + text[end:]
          p.write_text(text, encoding='utf-8')
      
      - name: Commit the form update and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign ECAM lead form with direct WhatsApp and Telegram" || exit 0
          git rm .github/workflows/update-ecam-form-social.yml
          git commit -m "Remove one-time form update workflow"
          git push